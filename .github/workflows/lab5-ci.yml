name: Lab 5 CI

on:
  push:
    branches:
      - main
      - feature/lab5-rest-api
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Generate API client and check TypeScript
        run: npm run typecheck

      - name: Backend tests with coverage
        run: npm run test -w backend -- --coverage --maxWorkers=1 --testTimeout=20000

      - name: Frontend tests
        run: npm run test -w frontend -- --maxWorkers=1

      - name: Build application
        run: npm run build

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab5-backend-coverage
          path: backend/coverage/
          if-no-files-found: ignore
